name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package
        shell: bash
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Verify packaged macOS startup
        if: matrix.platform == 'mac'
        shell: bash
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          app_dir=release/mac
          if [[ "$PACKAGE_ARCH" == "arm64" ]]; then
            app_dir=release/mac-arm64
          fi
          node scripts/smoke-packaged-app.cjs "$app_dir/Jarvis Browser.app/Contents/MacOS/Jarvis Browser"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-browser-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
